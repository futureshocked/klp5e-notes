<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 1.05rem;
    line-height: 1.75;
    color: #1a1a1a;
    background: #ffffff;
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  .note-eyebrow {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #64748b;
    margin: 0 0 0.4em 0;
  }

  h1.note-title {
    font-size: 1.9em;
    font-weight: 700;
    line-height: 1.2;
    color: #0f172a;
    margin: 0 0 0.8em 0;
    padding-bottom: 0.3em;
    border-bottom: 3px solid #0f766e;
  }

  h2 {
    font-size: 1.45em;
    font-weight: 700;
    color: #0f172a;
    margin-top: 2.2em;
    margin-bottom: 0.5em;
    padding-bottom: 6px;
    border-bottom: 2px solid #e2e8f0;
  }

  h3 { font-size: 1.15em; font-weight: 700; color: #0f766e; margin-top: 1.6em; margin-bottom: 0.4em; }
  h4 { font-size: 1em; font-weight: 700; color: #475569; margin-top: 1.2em; margin-bottom: 0.3em; }

  p { margin-top: 0.9em; margin-bottom: 0; }

  ul, ol { padding-left: 1.6em; margin-top: 0.6em; margin-bottom: 0.6em; }
  li { margin-bottom: 0.25em; }

  a { color: #1d4ed8; text-decoration: none; }
  a:hover { text-decoration: underline; }

  strong { font-weight: 700; }

  img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 1.4em auto 0.4em;
  }

  figure { margin: 1.4em 0; }
  figure img { margin-bottom: 0.4em; }
  figcaption { font-size: 0.9em; color: #64748b; text-align: center; }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.86em;
    background: #f1f5f9;
    color: #0f172a;
    padding: 2px 6px;
    border-radius: 4px;
  }

  pre {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 16px 20px;
    overflow-x: auto;
    margin: 1.1em 0;
  }
  pre code { background: none; padding: 0; font-size: 0.86em; color: #0f172a; }

  blockquote {
    margin: 1.1em 0;
    padding: 0.4em 1.1em;
    border-left: 4px solid #cbd5e1;
    color: #475569;
    font-style: italic;
  }

  table { width: 100%; border-collapse: collapse; margin: 1.3em 0; font-size: 0.95em; }
  th { background: #f1f5f9; color: #0f172a; font-weight: 700; text-align: left; padding: 10px 14px; border: 1px solid #e2e8f0; }
  td { padding: 9px 14px; border: 1px solid #e2e8f0; vertical-align: top; }
  tr:nth-child(even) td { background: #f8fafc; }

  .figure-pending {
    margin: 1.4em 0;
    padding: 22px 18px;
    border: 1px dashed #cbd5e1;
    border-radius: 6px;
    background: #f8fafc;
    color: #64748b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.9em;
    text-align: center;
  }

  .draft-pending {
    margin: 1.6em 0;
    padding: 28px 22px;
    border: 1px dashed #cbd5e1;
    border-radius: 6px;
    background: #f8fafc;
    color: #64748b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.92em;
    font-style: italic;
    text-align: center;
  }

  /* ---- Image lightbox: small thumbnail + "View full size" button, opening a
     full-screen overlay. Ported from klp5e-kicad's ImageLightbox.astro; the
     thumbnail keeps this template's existing block+margin:auto centering
     (matches the plain `img` rule above) and the button is centered via the
     figure's text-align, since this template (unlike the source component)
     always centers standalone images. ---- */
  .lightbox-figure {
    display: block;
    text-align: center;
    margin: 1.4em auto 0.4em;
  }

  .lightbox-thumbnail {
    display: block;
    margin: 0 auto;
    max-width: var(--lightbox-max-width, 50%);
    max-height: var(--lightbox-max-height, 350px);
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .lightbox-thumbnail:hover { opacity: 0.85; }

  .lightbox-view-btn {
    display: inline-block;
    margin: 0.5rem 0 0;
    padding: 0.35rem 0.75rem;
    font-size: 0.85rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--btn-bg, #0f766e);
    color: #ffffff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .lightbox-view-btn:hover { opacity: 0.9; }
  .lightbox-view-btn:focus-visible {
    outline: 2px solid var(--btn-bg, #0f766e);
    outline-offset: 2px;
  }

  /* ---- Foldable internal TOC (inserted after the first paragraph). Uses native
     <details>/<summary> so it works without JS and degrades gracefully. ---- */
  .note-toc {
    margin: 1.4em 0 2em;
    padding: 0.9em 1.2em;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
  }
  .note-toc > summary {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #0f766e;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 0.4em;
  }
  .note-toc > summary::-webkit-details-marker { display: none; }
  .note-toc > summary::before {
    content: "▾";
    font-size: 0.9em;
    transition: transform 0.2s ease;
  }
  .note-toc:not([open]) > summary::before { transform: rotate(-90deg); }
  .note-toc[open] > summary { margin-bottom: 0.6em; }
  .note-toc ul { margin: 0; padding-left: 1.2em; }
  .note-toc li { margin-bottom: 0.2em; }
  .note-toc a { color: #1d4ed8; }

  /* Nested H3 entries inside the TOC: indented, disc markers, muted. */
  .note-toc .note-toc-sub {
    margin: 0.2em 0 0.4em;
    padding-left: 1.2em;
    list-style: disc;
  }
  .note-toc .note-toc-sub li { margin-bottom: 0.15em; }
  .note-toc .note-toc-sub a { font-size: 0.95em; color: #475569; }

  /* ---- A-Z term index (Mini Encyclopedia note only). Same <details> chrome as
     .note-toc, but each row is a letter followed by that letter's terms flowing
     inline and wrapping, so 50+ entries stay compact instead of running down the
     page one per line. ---- */
  .note-term-index > ul { padding-left: 0; list-style: none; }
  .note-term-index > ul > li {
    display: flex;
    gap: 0.7em;
    align-items: baseline;
    margin-bottom: 0.35em;
  }
  .note-term-index .note-term-letter {
    flex: 0 0 1.1em;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.85em;
    font-weight: 700;
    color: #0f766e;
  }
  .note-term-index .note-toc-sub {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.15em 0.9em;
    margin: 0;
    padding-left: 0;
    list-style: none;
  }
  .note-term-index .note-toc-sub li { margin-bottom: 0; }

  /* Smooth-scroll to anchors when TOC links are clicked. Native CSS; no JS. */
  html { scroll-behavior: smooth; }

  /* Offset anchored headers so they don't hide under any sticky iframe top. */
  h2[id], h3[id] { scroll-margin-top: 1.5em; }

</style>

<div class="lightbox-wrapper" data-lightbox-wrapper>
<p class="note-eyebrow">KiCad Like a Pro, 5th Edition — Volume 2</p>
<h1 class="note-title">🚧 Copper Zones and Fills</h1>

<script>
  // TOC jump-link handler: in iframe contexts, native anchor navigation can be
  // suppressed by the parent page. Intercept TOC clicks and use scrollIntoView,
  // which scrolls the nearest scrollable ancestor (the iframe's own body).
  (function () {
    function initTocScroll() {
      var toc = document.querySelector('.note-toc');
      if (!toc) return;
      toc.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || href.charAt(0) !== '#') return;
        var id = href.substring(1);
        var target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTocScroll);
    } else {
      initTocScroll();
    }
  })();
</script>
<script>
  (function () {
    function initLightbox() {
      var wrappers = document.querySelectorAll('[data-lightbox-wrapper]');
      wrappers.forEach(function (wrapper) {
        var images = wrapper.querySelectorAll('img');

        images.forEach(function (img) {
          if (img.closest('.lightbox-figure')) return;
          var src = img.getAttribute('src');
          if (!src) return;

          var figure = document.createElement('div');
          figure.className = 'lightbox-figure';

          var thumbnail = document.createElement('img');
          thumbnail.src = src;
          thumbnail.alt = img.alt || '';
          thumbnail.className = 'lightbox-thumbnail';
          var loading = img.getAttribute('loading');
          if (loading) thumbnail.setAttribute('loading', loading);

          var button = document.createElement('button');
          button.className = 'lightbox-view-btn';
          button.type = 'button';
          button.textContent = 'View full size (opens in new tab)';
          button.setAttribute('aria-label', 'View full size image in new tab');

          function openFullSize() {
            fetch(src)
              .then(function (response) { return response.blob(); })
              .then(function (blob) {
                var blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
              });
          }
          thumbnail.addEventListener('click', openFullSize);
          button.addEventListener('click', openFullSize);

          figure.appendChild(thumbnail);
          figure.appendChild(button);
          img.replaceWith(figure);
        });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLightbox);
    } else {
      initLightbox();
    }
  })();
</script>
<!-- te-notes-autoheight v1 -->
<script>
  function sendHeight() {
    window.parent.postMessage({ iframeHeight: document.documentElement.scrollHeight }, '*');
  }
  // Send on own load events
  document.addEventListener('DOMContentLoaded', sendHeight);
  window.addEventListener('load', sendHeight);
  // Respond to ping from parent (parent pings once it is ready)
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'ping') sendHeight();
  });
  // Fallback: retry for 3 seconds in case both sides miss each other
  var _a = 0;
  var _iv = setInterval(function () {
    sendHeight(); if (++_a >= 6) clearInterval(_iv);
  }, 500);
</script>
